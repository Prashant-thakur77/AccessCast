<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
<title id="t">AccessCast: what runs where</title>
<desc id="d">A video is analysed on our computer; Gemma 4 31B on AMD Token Factory looks and writes; code plans and checks every line and sends failures back to Gemma; a person approves; voices and rendering run on our computer; a render gate refuses while any line waits; viewers pick their version in the player.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#141B34"/></marker></defs>
<rect width="1600" height="900" fill="#F6F1E7"/>
<text x="40" y="70" font-family="DejaVu Sans, sans-serif" font-size="40" font-weight="bold" fill="#141B34">How AccessCast works: what runs where</text>
<line x1="222" y1="380" x2="300" y2="330" stroke="#141B34" stroke-width="3" marker-end="url(#a)"/>
<line x1="240" y1="442" x2="280" y2="444" stroke="#141B34" stroke-width="3" marker-end="url(#a)"/>
<line x1="450" y1="330" x2="450" y2="380" stroke="#141B34" stroke-width="3" marker-end="url(#a)"/>
<line x1="620" y1="255" x2="670" y2="260" stroke="#141B34" stroke-width="3" marker-end="url(#a)"/>
<line x1="620" y1="389" x2="670" y2="369" stroke="#141B34" stroke-width="3" marker-end="url(#a)"/>
<line x1="825" y1="430" x2="825" y2="480" stroke="#141B34" stroke-width="3" marker-end="url(#a)"/>
<line x1="945" y1="480" x2="945" y2="430" stroke="#141B34" stroke-width="3" marker-end="url(#a)"/>
<line x1="991" y1="480" x2="1181" y2="300" stroke="#141B34" stroke-width="3" marker-end="url(#a)"/>
<line x1="1265" y1="300" x2="1265" y2="340" stroke="#141B34" stroke-width="3" marker-end="url(#a)"/>
<line x1="1265" y1="530" x2="1265" y2="570" stroke="#141B34" stroke-width="3" marker-end="url(#a)"/>
<line x1="1330" y1="570" x2="1420" y2="493" stroke="#141B34" stroke-width="3" marker-end="url(#a)"/>
<line x1="1380" y1="430" x2="1420" y2="428" stroke="#141B34" stroke-width="3" marker-end="url(#a)"/>
<rect x="30" y="380" width="210" height="110" rx="22" fill="#E8E3D6"/>
<text x="48" y="418" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="bold" fill="#141B34">Your video</text>
<text x="48" y="450" font-family="DejaVu Sans, Noto Sans Devanagari, sans-serif" font-size="18" fill="#141B34">dropped into Studio,</text>
<text x="48" y="476" font-family="DejaVu Sans, Noto Sans Devanagari, sans-serif" font-size="18" fill="#141B34">or on our site</text>
<rect x="280" y="140" width="340" height="190" rx="22" fill="#1B1E4B"/>
<text x="298" y="178" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">Listen</text>
<text x="298" y="210" font-family="DejaVu Sans, Noto Sans Devanagari, sans-serif" font-size="18" fill="#FFFFFF">Whisper + forced alignment</text>
<text x="298" y="236" font-family="DejaVu Sans, Noto Sans Devanagari, sans-serif" font-size="18" fill="#FFFFFF">Silero VAD: where speech is</text>
<text x="298" y="262" font-family="DejaVu Sans, Noto Sans Devanagari, sans-serif" font-size="18" fill="#FFFFFF">AST: sound labels</text>
<text x="298" y="288" font-family="DejaVu Sans, Noto Sans Devanagari, sans-serif" font-size="18" fill="#FFFFFF">PySceneDetect: scenes</text>
<rect x="280" y="380" width="340" height="150" rx="22" fill="#FFD23F"/>
<text x="298" y="418" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="bold" fill="#141B34">Plan</text>
<text x="298" y="450" font-family="DejaVu Sans, Noto Sans Devanagari, sans-serif" font-size="18" fill="#141B34">the pauses between words,</text>
<text x="298" y="476" font-family="DejaVu Sans, Noto Sans Devanagari, sans-serif" font-size="18" fill="#141B34">which line goes where,</text>
<text x="298" y="502" font-family="DejaVu Sans, Noto Sans Devanagari, sans-serif" font-size="18" fill="#141B34">the word budget</text>
<rect x="670" y="140" width="430" height="290" rx="22" fill="#E4402A"/>
<text x="688" y="178" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">Gemma 4 31B · Token Factory</text>
<text x="688" y="210" font-family="DejaVu Sans, Noto Sans Devanagari, sans-serif" font-size="18" fill="#FFFFFF">looks at frames, lists what it sees</text>
<text x="688" y="236" font-family="DejaVu Sans, Noto Sans Devanagari, sans-serif" font-size="18" fill="#FFFFFF">writes description from that list</text>
<text x="688" y="262" font-family="DejaVu Sans, Noto Sans Devanagari, sans-serif" font-size="18" fill="#FFFFFF">rewrites captions as easy-read</text>
<text x="688" y="288" font-family="DejaVu Sans, Noto Sans Devanagari, sans-serif" font-size="18" fill="#FFFFFF">translates: hi, it, es, fr</text>
<text x="688" y="314" font-family="DejaVu Sans, Noto Sans Devanagari, sans-serif" font-size="18" fill="#FFFFFF">writes voice-over lines</text>
<text x="688" y="340" font-family="DejaVu Sans, Noto Sans Devanagari, sans-serif" font-size="18" fill="#FFFFFF">repairs a line, told why</text>
<rect x="670" y="480" width="430" height="200" rx="22" fill="#FFD23F"/>
<text x="688" y="518" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="bold" fill="#141B34">Checks: code decides</text>
<text x="688" y="550" font-family="DejaVu Sans, Noto Sans Devanagari, sans-serif" font-size="18" fill="#141B34">every line, rule by rule: timing,</text>
<text x="688" y="576" font-family="DejaVu Sans, Noto Sans Devanagari, sans-serif" font-size="18" fill="#141B34">numbers, names, negations, sounds,</text>
<text x="688" y="602" font-family="DejaVu Sans, Noto Sans Devanagari, sans-serif" font-size="18" fill="#141B34">claims, language. A failed line goes</text>
<text x="688" y="628" font-family="DejaVu Sans, Noto Sans Devanagari, sans-serif" font-size="18" fill="#141B34">back to Gemma with the reason.</text>
<rect x="1150" y="140" width="230" height="160" rx="22" fill="#1E7A4C"/>
<text x="1168" y="178" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">A person</text>
<text x="1168" y="210" font-family="DejaVu Sans, Noto Sans Devanagari, sans-serif" font-size="18" fill="#FFFFFF">reviews every line,</text>
<text x="1168" y="236" font-family="DejaVu Sans, Noto Sans Devanagari, sans-serif" font-size="18" fill="#FFFFFF">keyboard only:</text>
<text x="1168" y="262" font-family="DejaVu Sans, Noto Sans Devanagari, sans-serif" font-size="18" fill="#FFFFFF">approve, edit, reject</text>
<rect x="1150" y="340" width="230" height="190" rx="22" fill="#1B1E4B"/>
<text x="1168" y="378" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">Voice + render</text>
<text x="1168" y="410" font-family="DejaVu Sans, Noto Sans Devanagari, sans-serif" font-size="18" fill="#FFFFFF">Kokoro voices:</text>
<text x="1168" y="436" font-family="DejaVu Sans, Noto Sans Devanagari, sans-serif" font-size="18" fill="#FFFFFF">en, hi, it, es, fr</text>
<text x="1168" y="462" font-family="DejaVu Sans, Noto Sans Devanagari, sans-serif" font-size="18" fill="#FFFFFF">ffmpeg: mix, holds,</text>
<text x="1168" y="488" font-family="DejaVu Sans, Noto Sans Devanagari, sans-serif" font-size="18" fill="#FFFFFF">loudness checks</text>
<rect x="1150" y="570" width="230" height="110" rx="22" fill="#FFD23F"/>
<text x="1168" y="608" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="bold" fill="#141B34">Render gate</text>
<text x="1168" y="640" font-family="DejaVu Sans, Noto Sans Devanagari, sans-serif" font-size="18" fill="#141B34">refuses while a</text>
<text x="1168" y="666" font-family="DejaVu Sans, Noto Sans Devanagari, sans-serif" font-size="18" fill="#141B34">line still waits</text>
<rect x="1420" y="260" width="160" height="330" rx="22" fill="#12355B"/>
<text x="1438" y="298" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">Viewers</text>
<text x="1438" y="330" font-family="DejaVu Sans, Noto Sans Devanagari, sans-serif" font-size="18" fill="#FFFFFF">can't see</text>
<text x="1438" y="356" font-family="DejaVu Sans, Noto Sans Devanagari, sans-serif" font-size="18" fill="#FFFFFF">can't hear</text>
<text x="1438" y="382" font-family="DejaVu Sans, Noto Sans Devanagari, sans-serif" font-size="18" fill="#FFFFFF">simpler words</text>
<text x="1438" y="408" font-family="DejaVu Sans, Noto Sans Devanagari, sans-serif" font-size="18" fill="#FFFFFF">हिन्दी</text>
<text x="1438" y="434" font-family="DejaVu Sans, Noto Sans Devanagari, sans-serif" font-size="18" fill="#FFFFFF">Italiano</text>
<text x="1438" y="460" font-family="DejaVu Sans, Noto Sans Devanagari, sans-serif" font-size="18" fill="#FFFFFF">Español</text>
<text x="1438" y="486" font-family="DejaVu Sans, Noto Sans Devanagari, sans-serif" font-size="18" fill="#FFFFFF">Français</text>
<text x="1438" y="512" font-family="DejaVu Sans, Noto Sans Devanagari, sans-serif" font-size="18" fill="#FFFFFF"></text>
<text x="1438" y="538" font-family="DejaVu Sans, Noto Sans Devanagari, sans-serif" font-size="18" fill="#FFFFFF">player site</text>
<rect x="40" y="800" width="34" height="34" rx="8" fill="#E4402A"/>
<text x="86" y="826" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#141B34">AMD Token Factory</text>
<rect x="340" y="800" width="34" height="34" rx="8" fill="#1B1E4B"/>
<text x="386" y="826" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#141B34">our computer</text>
<rect x="640" y="800" width="34" height="34" rx="8" fill="#FFD23F"/>
<text x="686" y="826" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#141B34">code</text>
<rect x="940" y="800" width="34" height="34" rx="8" fill="#1E7A4C"/>
<text x="986" y="826" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#141B34">a person</text>
<rect x="1240" y="800" width="34" height="34" rx="8" fill="#12355B"/>
<text x="1286" y="826" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#141B34">the viewer's browser</text>
</svg>