[project]
name = "accesscast"
version = "0.1.0"
description = "One video in, a version for each viewer out: audio description, SDH, easy-read, Hindi and Italian. Gemma 4 on AMD Instinct MI300X."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
authors = [{ name = "AccessCast team" }]
dependencies = [
  "pydantic>=2.8",
  "httpx>=0.27",
  "typer>=0.12",
  "numpy>=1.26",
  "pillow>=10.3",
  "jiwer>=3.0",
  "webvtt-py>=0.5",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "spacy>=3.8,<3.9",
  "en-core-web-sm",
  "wordfreq>=3.1",
  "textstat>=0.7",
  "soundfile>=0.12",
  "pyarrow>=26.0.0",
]

[project.optional-dependencies]
analysis = [
  "scenedetect[opencv-headless]>=0.6.4",
]

[project.scripts]
accesscast = "accesscast.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.hatch.build.targets.wheel]
packages = ["src/accesscast"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "eval", "workers"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "SIM105", "SIM108", "RUF005", "RUF007", "RUF059"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["accesscast"]
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["accesscast.verify.*", "accesscast.repair.*", "accesscast.confidence", "accesscast.review.gate"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/golden"]
addopts = "-q"
pythonpath = ["src", "."]
