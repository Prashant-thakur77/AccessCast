name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - name: sync
        run: uv sync --all-extras
      - name: lint
        run: uv run ruff check src tests eval workers scripts
      - name: types
        run: uv run mypy
      - name: unit tests
        run: uv run pytest
      - name: claims
        run: uv run accesscast claims-check
      - name: fake pipeline on the fixture (no GPU, placeholder TTS)
        run: |
          ACCESSCAST_PROJECTS_DIR=$RUNNER_TEMP/proj uv run accesscast demo-fixture --no-serve
